
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAS JIRA 甘特圖產生器_v1.5.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>




    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="bg-gray-100 h-screen overflow-hidden">

    <div id="app-container" class="bg-white w-full h-full flex flex-col p-4 sm:p-6 space-y-4">
        <div class="flex-shrink-0">
            <div class="flex flex-wrap justify-between items-center gap-4">
                <div class="flex items-center gap-4">
                    <h1 class="text-xl sm:text-2xl font-bold text-gray-800">FAS JIRA 甘特圖產生器_v1.5.1</h1>
                    <input type="file" id="excel-file-input" class="hidden" accept=".xlsx, .xls, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel">
                    <label for="excel-file-input" class="file-input-label inline-block bg-blue-500 text-white font-semibold py-2 px-5 rounded-lg shadow-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-opacity-75">瀏覽檔案</label>
                </div>
                <div id="file-name-display" 
                    style="font-size:16px; color:#000000; background-color:#f0f0f0; padding:4px;">
                    點擊瀏覽檔案的按鈕以開始，來載入excel。
                </div>


            </div>

            <div id="gantt-controls" class="hidden mt-3 bg-gray-50 p-2 rounded-lg border flex flex-wrap items-center justify-between gap-x-6 gap-y-3">
                <div class="flex items-center gap-2 flex-wrap">
                    <label for="start-date" class="text-sm font-medium text-gray-700">起始日期:</label>
                    <input type="date" id="start-date" class="border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm p-1">
                    <label for="end-date" class="text-sm font-medium text-gray-700 ml-2">結束日期:</label>
                    <input type="date" id="end-date" class="border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm p-1">
                    <label for="freeze-cols" class="text-sm font-medium text-gray-700 ml-4">凍結欄數:</label>
                    <input type="number" id="freeze-cols" class="border-gray-300 rounded-md shadow-sm w-16 text-sm p-1" value="2" min="0">
                </div>
                
                <div class="flex items-center gap-2 flex-wrap">
                    <button id="generate-gantt-btn" class="bg-green-500 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-green-600 text-sm">產生日期欄</button>
                    <button id="export-excel-btn" class="bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-blue-700 text-sm">輸出Excel</button>
                    <button id="collapse-all-btn" class="flex items-center bg-yellow-500 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-yellow-600 text-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 4H4m0 0v4m0-4l5 5m1-5h4m0 0v4m0-4l-5 5M8 20H4m0 0v-4m0 4l5-5m1 5h4m0 0v-4m0 4l-5-5"/></svg>
                        收折全部
                    </button>
                    <button id="expand-all-btn" class="flex items-center bg-indigo-500 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-indigo-600 text-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l-5-5m11 5v-4m0 0h-4m4 0l-5-5"/></svg>
                        展開全部
                    </button>
                </div>

                <div class="flex items-center gap-4">
                    <button id="view-changes-btn" class="flex items-center bg-gray-500 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-gray-600 text-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                        查看變更
                    </button>
                    <button id="stats-btn" class="flex items-center bg-purple-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-purple-700 text-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h4v8H3v-8zm7-6h4v14h-4V7zm7-4h4v18h-4V3z"/></svg>
                        統計分析
                    </button>

                    <div id="data-summary" class="text-gray-600 font-medium text-sm"></div>
                    <div class="flex items-center">
                        <input id="highlight-toggle" type="checkbox" class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                        <label for="highlight-toggle" class="ml-2 block text-sm font-medium text-gray-700">高亮行列</label>
                    </div>
                </div>
            </div>
            <div id="error-message" class="text-center text-red-500 h-5 text-sm mt-2"></div>
        </div>

        <div id="excel-content-container" class="flex-grow relative">
            <div id="excel-content" class="absolute inset-0 overflow-auto rounded-lg border border-black"></div>
        </div>
    </div>

    <div id="error-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full flex items-center justify-center z-50">
        <div class="relative mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <h3 class="text-lg leading-6 font-medium text-gray-900">錯誤</h3>
                <div class="mt-2 px-7 py-3">
                    <p id="modal-error-text" class="text-sm text-gray-500">表格不存在</p>
                </div>
                <div class="items-center px-4 py-3">
                    <button id="modal-confirm-btn" class="px-4 py-2 bg-blue-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-300">確認</button>
                </div>
            </div>
        </div>
    </div>

    

    <div id="changes-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full flex items-center justify-center z-50">
        <div class="relative mx-auto p-5 border w-full max-w-2xl shadow-lg rounded-md bg-white">
            <div class="mt-3">
                <h3 class="text-lg leading-6 font-medium text-gray-900 text-center">變更紀錄</h3>
                <div id="changes-list" class="mt-4 max-h-96 overflow-y-auto text-sm"></div>
                <div class="items-center px-4 py-3 mt-4 flex gap-4">
                    <button id="download-changes-btn" class="px-4 py-2 bg-green-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-green-600">下載紀錄</button>
                    <button id="changes-modal-close-btn" class="px-4 py-2 bg-blue-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-blue-600">關閉</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 統計分析 Modal -->
    <div id="stats-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full flex items-center justify-center z-50">
        <div class="relative mx-auto p-5 border w-full max-w-5xl shadow-lg rounded-md bg-white h-[80vh] flex flex-col modal-panel">
            <div class="mt-1">
                <h3 class="text-lg leading-6 font-medium text-gray-900 text-center">統計分析</h3>

                <div class="mt-4 grid grid-cols-1 gap-6 max-h-[60vh] overflow-y-auto flex-1 overflow-auto">
                    <!-- 表格 1 -->
                    <div class="stats-wrap">
                        <div class="flex items-center justify-between mb-2">
                            <h4 class="font-semibold text-gray-800">表格1：產品 + Bug + 技術研究 + 專案</h4>
                            <span class="text-xs text-gray-500" id="stats1-range-hint"></span>
                        </div>
                        <div class="overflow-auto border rounded">
                            <table id="stats-table-1" class="min-w-full text-sm border-collapse"></table>
                        </div>
                    </div>

                    <!-- 表格 2 -->
                    <div class="stats-wrap">
                        <div class="flex items-center justify-between mb-2">
                            <h4 class="font-semibold text-gray-800">表格2：DRBC的衍伸stories</h4>
                            <span class="text-xs text-gray-500" id="stats2-range-hint"></span>
                        </div>
                        <div class="overflow-auto border rounded">
                            <table id="stats-table-2" class="min-w-full text-sm border-collapse"></table>
                        </div>
                    </div>

                    <!-- 明細表區（初始隱藏） -->
                    <div id="stats-detail" class="hidden">
                        <div class="flex items-center justify-between mb-2">
                            <h4 id="stats-detail-title" class="font-semibold text-gray-800">明細</h4>
                            <button id="stats-detail-close" class="text-sm px-3 py-1 rounded bg-gray-200 hover:bg-gray-300">關閉明細</button>
                        </div>
                        <div class="detail-scroller">
                            <table id="stats-detail-table" class="detail-table text-sm w-max"></table>
                        </div>
                    </div>

                </div>

                <div class="items-center px-4 py-3 mt-4 flex gap-4">
                    <button id="stats-download-btn" class="px-4 py-2 bg-green-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-green-600">下載 CSV</button>
                    <button id="stats-close-btn" class="px-4 py-2 bg-blue-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-blue-600">關閉</button>
                </div>
            </div>
        </div>
    </div>


    <div id="filter-popup" class="hidden absolute bg-white border border-gray-300 rounded-md shadow-lg z-50 p-3 w-64">
        <div class="mb-2 border-b pb-2">
            <input type="text" id="filter-search-input" placeholder="搜尋選項..." class="w-full border-gray-300 rounded-md shadow-sm text-sm p-1 focus:border-blue-500 focus:ring-blue-500">
        </div>
        <div id="filter-options" class="max-h-60 overflow-y-auto mb-2 text-sm"></div>
        <div class="flex justify-between items-center border-t pt-2">
            <button id="filter-apply-btn" class="text-sm bg-blue-500 text-white px-3 py-1 rounded-md hover:bg-blue-600">套用</button>
            <button id="filter-cancel-btn" class="text-sm bg-gray-200 px-3 py-1 rounded-md hover:bg-gray-300">取消</button>
        </div>
    </div>

    <div id="context-menu">
        <div id="context-move-left">向左移動</div>
        <div id="context-move-right">向右移動</div>
        <div id="context-hide-col">隱藏直行</div>
        <div id="context-unhide-all-cols">取消隱藏所有直行</div>
    </div>

        <script src="assets/js/app.js"></script>

    </body>
    <div id="author-note">Author: Frank</div>

</html>
